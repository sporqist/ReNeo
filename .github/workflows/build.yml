name: Build
on:
  push:
    branches:
    - '**'
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      # Actions are pinned to commit hashes, tags can be moved
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up D compiler
        uses: dlang-community/setup-dlang@0a7469b93f791d83f30932c6fd105796c6966e20 # v2.0.0
        with:
          compiler: ldc-1.43.0
      - name: Build resource file from source
        run: |
          $rc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x86\rc.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          Push-Location res
          & $rc.FullName /nologo /fo reneo.res reneo.rc
          Pop-Location
      - name: Run unit tests
        run: dub test --compiler=ldc2
      - name: Run unit tests with file logging
        run: dub test --compiler=ldc2 --build=unittest-log
      - name: Compile release version
        run: dub build --compiler=ldc2 --build=release
      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reneo
          path: |
            reneo.exe
            cairo.dll
